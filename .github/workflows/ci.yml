name: Order Service CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: order_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d order_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/order_db?schema=public
      JWT_SECRET: test-secret-key-for-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout shared repo
        uses: actions/checkout@v4
        with:
          repository: ShopEcommerce/ecommerce_shop-shared
          path: shared

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Build Shared Library
        run: |
          cd shared
          npm install --cache .npm-cache
          npm run build
          npm pack --cache .npm-cache

      - name: Install Dependencies
        run: |
          npm install ./shared/teleshop-common-1.0.4.tgz --cache .npm-cache
          npm install --cache .npm-cache

      - name: Generate Prisma Client
        run: |
          npx prisma generate

      - name: Run Linter
        run: |
          npm run lint

      - name: Run Tests
        run: |
          npm run test:ci
